# Render Blueprint for the HPS OMS API.
#
# Create the blueprint from the repository root ("New > Blueprint") and point it
# at this file. Render reads it and provisions the web service below.
#
# SECRETS ARE NOT IN THIS FILE.
#   MONGODB_URI, JWT_ACCESS_SECRET and JWT_REFRESH_SECRET are declared with
#   `sync: false`, so Render prompts for them and stores them as secret values.
#   Never commit real credentials.
#
# ---------------------------------------------------------------------------
# MONGODB_URI IS THE VALUE THAT BREAKS DEPLOYS - READ THIS FIRST
# ---------------------------------------------------------------------------
# Symptom:
#   MongooseServerSelectionError: connect ECONNREFUSED ::1:27017
#   connect ECONNREFUSED 127.0.0.1:27017
#   ==> Exited with status 1
#
# Meaning: MONGODB_URI is still the local development value
# (mongodb://localhost:27017/hps_OMS from backend/.env.example). Render's
# containers have no MongoDB on localhost, so the connection is refused and the
# process exits before it ever listens on PORT. The API is then unreachable, the
# public site gets no JSON back, and the homepage renders blank.
#
# Fix: set MONGODB_URI to a real hosted MongoDB in the Render dashboard
# (Environment), for example a MongoDB Atlas free cluster:
#   mongodb+srv://<user>:<password>@<cluster>.mongodb.net/hps_oms?retryWrites=true&w=majority
# Then redeploy. Atlas also needs Network Access -> IP Access List to include
# 0.0.0.0/0 (Render's outbound IPs are not static), or the connection will hang
# instead of being refused.
#
# Watch out: dotenv logs "injected env (0) from .env" on Render and that is
# NORMAL. Render injects real variables from its own environment; the absence of
# a .env file in the image is expected and is not the problem.
#
# Note: Render does not offer MongoDB (only Postgres/Redis/Key Value), so
# Atlas - or another external MongoDB host - is required. The commented
# `databases:` block below is intentionally NOT usable for this app.

databases:
  # Render provisions Postgres/Redis, not MongoDB, so this app cannot use the
  # `databases:` key. Point MONGODB_URI at MongoDB Atlas instead. The block is
  # kept only to show where a persistent disk would be attached.
  #
  # - name: hps-oms-api
  #   plan: starter
  #   disk:               # persistent storage for uploads
  #     name: uploads
  #     mountPath: /opt/render/project/src/backend/uploads
  #     sizeGB: 1

services:
  - type: web
    name: hps-oms-api
    runtime: node
    plan: starter # the free plan sleeps after inactivity and is not production
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Free instances spin down after 15 minutes idle; Render pings the health
    # check path to wake them, which avoids cold starts on the first request.
    autoDeploy: true
    envVars:
      # ---- runtime ----
      - key: NODE_ENV
        value: production
      # Render injects PORT; leaving it unset makes the service bind 5000.
      - key: API_PREFIX
        value: /api

      # ---- database (secret) ----
      # PROMPT: paste a real hosted MongoDB URI, e.g.
      #   mongodb+srv://user:pass@cluster.mongodb.net/hps_oms?retryWrites=true&w=majority
      # Never accept the mongodb://localhost:27017 default from .env.example:
      # that is what produces ECONNREFUSED 127.0.0.1:27017 and a failed deploy.
      - key: MONGODB_URI
        sync: false

      # ---- auth (secret) ----
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 30m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 10

      # ---- client (set this to your Netlify origin) ----
      # Comma separate for preview deploys:
      # https://hps-oms.netlify.app,https://deploy-preview--123--hps-oms.netlify.app
      - key: CLIENT_URL
        sync: false

      # ---- storage ----
      # UPLOAD_DIR points at the Render disk mount (see the commented block
      # above). Without a disk, uploads live on the container filesystem and are
      # WIPED on every deploy and restart.
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_IMAGE_SIZE_MB
        value: 5
      - key: MAX_VIDEO_SIZE_MB
        value: 100
      - key: MAX_DOCUMENT_SIZE_MB
        value: 25

      # ---- first Super Admin (created once, by `npm run seed`) ----
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"